# docker-compose.prod.yml
#
# Samodzielny stack do wklejenia w ZimaOS: App Center -> "Install a Customized App"
# -> Import -> zakladka "Docker Compose" -> wklej ta zawartosc -> Submit -> Install.
#
# W odroznieniu od docker-compose.yml (ktory buduje obraz web lokalnie), ten plik
# tylko pobiera gotowe obrazy - nie wymaga dostepu do repo na dysku NAS.
#
# WAZNE - przed instalacja w ZimaOS:
# 1. ADMIN_PASSWORD jest dostepny publicznie przez /admin - koniecznie ustaw wlasne haslo.
# 2. POSTGRES_PASSWORD nie jest wystawiony na zewnatrz (siec wewnetrzna wedding_net),
#    domyslna wartosc jest bezpieczna do startu, ale musi byc identyczna w obu miejscach
#    (POSTGRES_PASSWORD i DATABASE_URL).
# 3. Porty Caddy nizej (8080/8443) sa tylko punktem startowym - kazdy NAS ma inny zestaw
#    zajetych portow (ZimaOS/CasaOS dashboard, inne zainstalowane appki typu Nginx Proxy
#    Manager czesto siedza wlasnie na 80/443/8080/8443). Przy imporcie ZimaOS pokaze
#    czerwony blad "there are ports in use", jesli wybrany port jest zajety - zmien go
#    w formularzu na jakikolwiek wolny (np. sprawdzajac `sudo ss -tlnp` po SSH) i
#    zaktualizuj URL, pod którym bedzie dostepna aplikacja, odpowiednio.
# 4. Jesli zmieniasz porty/adres, zaktualizuj APP_DOMAIN w serwisie "web" na realny
#    adres NAS-a wraz z portem (np. http://192.168.1.50:8080), inaczej generowane
#    linki/QR kody beda wskazywac na "http://localhost".
services:
  postgres:
    image: postgres:16-alpine
    container_name: wedding_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding_secret
      POSTGRES_DB: wedding_drop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_drop"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wedding_net

  web:
    image: ghcr.io/p4cino/wedding-drop:latest
    container_name: wedding_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://wedding:wedding_secret@postgres:5432/wedding_drop
      DATA_DIR: /app/data
      APP_DOMAIN: http://localhost
      ADMIN_PASSWORD: ZMIEN_MNIE_haslo_admina
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: ""
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wedding_net

  caddy:
    image: caddy:2-alpine
    container_name: wedding_caddy
    restart: unless-stopped
    # Caddyfile jest wpiety w repo (nie w tym pliku compose, ktory jest wklejany
    # bez dostepu do plikow na dysku). "caddy --config" NIE umie sciagnac configu
    # spod URL-a samodzielnie (proboje otworzyc go jako lokalna sciezke i pada z
    # "no such file or directory") - stad najpierw pobieramy plik przez wget, a
    # potem odpalamy caddy na lokalnej kopii.
    command:
      [
        "sh",
        "-c",
        "wget -qO /etc/caddy/Caddyfile https://raw.githubusercontent.com/p4cino/wedding-drop/v1.0.0/Caddyfile && caddy run --config /etc/caddy/Caddyfile --adapter caddyfile",
      ]
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      # Prefiks "http://" wylacza automatyczne HTTPS/Let's Encrypt Caddy - wymagane,
      # bo port 443 nie jest tu publicznie widoczny jako 443 (patrz komentarz wyzej).
      APP_DOMAIN: http://localhost
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - app_data:/app/data:ro
    depends_on:
      - web
    networks:
      - wedding_net

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:

networks:
  wedding_net:
    driver: bridge
