services:
  postgres:
    # Wymagany PostgreSQL >= 16.16 (łatka bezpieczeństwa dla CVE-2026-6460)
    image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    container_name: wedding_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wedding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wedding_secret}
      POSTGRES_DB: ${POSTGRES_DB:-wedding_drop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wedding} -d ${POSTGRES_DB:-wedding_drop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NODE_OPTIONS: "--max-old-space-size=768"
      DATABASE_URL: postgres://${POSTGRES_USER:-wedding}:${POSTGRES_PASSWORD:-wedding_secret}@postgres:5432/${POSTGRES_DB:-wedding_drop}
      DATA_DIR: /app/data
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - app_data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    # Na serwerze z procesorem Intel N100 możesz odkomentować poniższe linie dla akceleracji grafiki QuickSync (QSV):
    # devices:
    #   - /dev/dri:/dev/dri
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 1024M
        reservations:
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  caddy:
    # Wymagany Caddy >= 2.11.5 (łatki bezpieczeństwa dla CVE-2026-55458 i CVE-2026-77281)
    # Lokalny build aktualizuje biblioteki systemowe Alpine (zlib, openssl, musl)
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: wedding-drop-caddy:latest
    container_name: wedding_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend_net

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
